name: Go

on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main, v2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Verify formatting
      run: |
        go fmt ./...
        git diff --exit-code
    
    - name: Run go mod tidy
      run: |
        go mod tidy
        git diff --exit-code
    
    - name: Check dependencies
      run: make check-deps
    
    - name: Vet
      run: go vet ./...
    
    - name: Unit Tests
      run: go test -v -short -race ./...
    
    - name: Integration Tests (Docker-in-Docker)
      run: cd test/integration && go test -v -race -timeout=5m
